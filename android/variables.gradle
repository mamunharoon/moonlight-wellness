ext {
    minSdkVersion = 23
    // Matches the SDK level already used for the existing distributed
    // internal-testing build (android-prep worktree's own variables.gradle)
    // -- Capacitor's stock generator defaults to 35; bumped to stay
    // consistent with what's already been tested/uploaded, not a fresh
    // decision. android-36/android-36.1 are both installed locally.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}