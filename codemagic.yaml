# WakeWise — Codemagic iOS/TestFlight pipeline.
#
# Manual-start only: this workflow deliberately has no `triggering` block.
# Codemagic only builds a workflow automatically if `triggering` names an
# event (push/pull_request/tag) or a `schedule`; omitting it entirely
# means the ONLY way to start this workflow is a deliberate "Start new
# build" in the Codemagic UI (or an explicit API call) with this branch
# picked by hand each time. Do not add a `triggering` block without
# re-reading that consequence first — it exists specifically to conserve
# build minutes and prevent an accidental TestFlight upload from a
# routine commit.
#
# No credential of any kind belongs in this file. Every signing/App Store
# Connect value below is a *name* of something configured in Codemagic's
# own encrypted storage (an Integration, or an application-level
# Environment variable group referenced only by name at build time,
# never by value here) — see docs/codemagic-setup-guide.md for exactly
# what to create and where. Do not replace any of the names below with a
# real key, token, or .p8 file content "to make it work" — that value
# goes into Codemagic's UI, never into this repository.

workflows:
  wakewise-ios-testflight:
    name: WakeWise iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Verify this Xcode version is still offered in Codemagic's current
      # Xcode-version list at setup time (Codemagic periodically retires
      # old images) — see https://docs.codemagic.io/specs/versions-macos/
      # for what's currently available. 26.6 is Codemagic's current
      # default macOS image (confirmed via Codemagic's docs as of this
      # commit) and satisfies Apple's App Store Connect upload
      # requirement (error 19241) that, from April 28, 2026, every
      # iOS/iPadOS submission be built with Xcode 26+ against the iOS 26
      # SDK: a prior pin at Xcode 16.4 (bundling the iOS 18.5 SDK) was
      # rejected by Apple's validation with exactly that error. Capacitor
      # (7.6.9 here) is fully forward-compatible with Xcode 26/iOS 26 --
      # this is purely a build-toolchain requirement, not a Capacitor or
      # app-code change, so the iOS deployment target
      # (ios/App/Podfile's `platform :ios, '14.0'`) is deliberately left
      # untouched. Picked as an explicit stable minor-version pin rather
      # than an unpinned "latest" or "edge", which could jump to an
      # untested release between builds. Adjust the value here, not by
      # leaving it unpinned, if it needs to change.
      xcode: 26.6
      cocoapods: default
      # Build 15 failed here: @supabase/realtime-js (pulled in by
      # supabaseClient.js, exercised at module-load time by
      # meditationSessionController.test.js) requires Node's native
      # WebSocket global, which only exists from Node 22 onward - Node
      # 20.18.1 doesn't have it ("Node.js detected but native WebSocket
      # not found"). This had never surfaced before because every prior
      # Codemagic build was cut from `main`, which predates the commit
      # that added that test file - this is the first build from `dev`.
      # 22.23.3 is the current Node 22 ("Jod") LTS patch release (an
      # exact pin, not an unbounded `latest`/`lts` stream) - verified
      # locally under this exact binary (official nodejs.org build,
      # checksum-verified) before this change: npm ci, the previously-
      # failing test, the full suite (194 files / 3263 tests), lint, and
      # the production build all pass identically to the Node-agnostic
      # local baseline. Deliberately not Node 24 - 22 is the smallest
      # runtime bump that supplies the required WebSocket support.
      node: 22.23.3
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # Single source of truth for the app's bundle identifier.
        # ios_signing.bundle_identifier below aliases this same value
        # (via the &bundle_id anchor) instead of repeating it, so there
        # is only ever one place to change it. Verified identical, as
        # of this commit, to capacitor.config.ts's "appId" (both the
        # repo root and ios/App/App copies), ios/App/App.xcodeproj's
        # PRODUCT_BUNDLE_IDENTIFIER (Debug and Release configs), and
        # ios/App/App/Info.plist. Do not guess or change this value --
        # it must keep matching the Xcode project and the App Store
        # Connect app record exactly, or signing/publishing breaks.
        BUNDLE_ID: &bundle_id "com.zavaraai.wakewise"
      groups:
        # wakewise_vite_public is an APPLICATION-level environment
        # variable group, created under this app's own
        # Application -> Environment variables in Codemagic (not the
        # deprecated Teams/Personal-account-wide global variable area,
        # which no longer supports creating named groups on a personal
        # account). Holds only VITE_SUPABASE_URL and
        # VITE_SUPABASE_PUBLISHABLE_KEY, both marked Secret -- the same
        # public, RLS-respecting publishable key (replaces the legacy
        # anon key -- DEV service-role credential exposure remediation,
        # see tracker SEC-07/E-37) already compiled into every WakeWise
        # web/preview build; safe to bundle client-side, never a genuine
        # secret. Do NOT add a secret key, Stripe secret, or anything
        # else to this group. See docs/codemagic-setup-guide.md for
        # exactly how it was created.
        - wakewise_vite_public
      ios_signing:
        # Automatic signing: Codemagic provisions/renews the Apple
        # Distribution certificate and App Store provisioning profile
        # itself via the App Store Connect integration below -- nothing
        # manual to upload here, and no certificate/profile file lives in
        # this repo.
        distribution_type: app_store
        bundle_identifier: *bundle_id
    integrations:
      # Name of the App Store Connect API key integration to create in
      # Codemagic (Teams -> Integrations -> App Store Connect). The .p8
      # key, issuer ID, and key ID are uploaded once, there, and stay in
      # Codemagic's encrypted storage -- this is only a reference name.
      app_store_connect: wakewise_app_store_connect
    cache:
      cache_paths:
        # Only the *global* CocoaPods download cache -- never the
        # project's own ios/App/Pods directory, which must always be
        # resolved fresh from Podfile.lock by `pod install` so a cached,
        # possibly-stale native dependency can never silently ship.
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Verify required build-time env vars are set
        script: |
          set -uo pipefail
          # Confirms VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY
          # were actually supplied via the wakewise_vite_public
          # application-level group (environment.groups, above) before
          # npm ci/build/signing ever run. Values are never printed --
          # only the name of a missing variable, so nothing sensitive
          # reaches the build log even on failure.
          missing=0
          for var_name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required environment variable: $var_name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required environment variables are unset. Confirm they're present in the wakewise_vite_public group under this app's Environment variables in Codemagic (see docs/codemagic-setup-guide.md) and re-run the build."
            exit 1
          fi

      - name: Install npm dependencies (npm ci)
        script: |
          set -euo pipefail
          npm ci

      - name: Build the web app (vite build)
        script: |
          set -euo pipefail
          npm run build

      - name: Run the automated test suite
        script: |
          set -euo pipefail
          npm test

      - name: Lint
        script: |
          set -euo pipefail
          npm run lint

      - name: Capacitor sync (copy web build + native deps into ios/)
        script: |
          set -euo pipefail
          npx cap sync ios

      - name: Verify WebView debugging is disabled in the generated native config
        script: |
          set -euo pipefail
          # Defense-in-depth alongside capacitor.config.ts's own default-false
          # webContentsDebuggingEnabled (see src/lib/capacitorWebDebug.test.js,
          # part of "Run the automated test suite" above) -- this checks the
          # actual file Capacitor just generated and Xcode will bundle into
          # the shipped app, so a stray CAPACITOR_WEB_DEBUG=true left set in a
          # Codemagic environment variable is still caught here even though
          # the source-level test above can't see it (Codemagic env vars
          # aren't present when a contributor runs `npm test` locally).
          generated_config="ios/App/App/capacitor.config.json"
          if [ ! -f "$generated_config" ]; then
            echo "$generated_config was not generated by 'Capacitor sync' -- cannot verify WebView debugging is disabled. Aborting."
            exit 1
          fi
          if grep -q '"webContentsDebuggingEnabled"[[:space:]]*:[[:space:]]*true' "$generated_config"; then
            echo "webContentsDebuggingEnabled is true in $generated_config -- this must never ship in a TestFlight/release build (see docs/ios-security-privacy-future-requirements.md). Aborting."
            exit 1
          fi
          echo "Confirmed: webContentsDebuggingEnabled is not true in the generated native config."

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd ios/App
          pod install

      - name: Set a unique, monotonically increasing build number
        script: |
          set -euo pipefail
          # $BUILD_NUMBER is Codemagic's own auto-incrementing counter for
          # this workflow -- strictly increasing across builds without this
          # repo ever tracking or committing a build number itself. (There
          # is no $CM_BUILD_NUMBER variable -- referencing it under `set -u`
          # is what previously failed the build with "unbound variable".)
          # CFBundleShortVersionString (MARKETING_VERSION, currently 1.0)
          # is deliberately left untouched here -- that's a product
          # decision, not something the pipeline should bump on its own.
          if [ -z "${BUILD_NUMBER:-}" ]; then
            echo "BUILD_NUMBER was not provided by Codemagic for this build; falling back to the current UTC epoch-seconds timestamp so CFBundleVersion still increases monotonically."
            BUILD_NUMBER="$(date -u +%s)"
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "BUILD_NUMBER ('$BUILD_NUMBER') is not a plain non-negative integer -- App Store Connect requires CFBundleVersion to be numeric. Aborting."
            exit 1
          fi
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Apply the stored signing certificate and profile to the Xcode project
        script: |
          set -euo pipefail
          # Codemagic's own built-in "Set up code signing identities" step
          # (which runs automatically before this workflow's scripts,
          # driven entirely by environment.ios_signing -- distribution_type
          # and bundle_identifier, above -- plus the wakewise_app_store
          # _connect integration) has already located and installed the
          # existing wakewise_distribution certificate and
          # wakewise_app_store_profile provisioning profile from this
          # Codemagic account's own signing-identity storage by the time
          # this script runs. Do NOT call `app-store-connect
          # fetch-signing-files` or `keychain add-certificates` here --
          # that was tried and removed: it duplicated work Codemagic's
          # built-in step already does, and it failed with "Cannot save
          # Signing Certificates without certificate private key" because
          # this account's stored certificate has no exportable private
          # key for a second, redundant save attempt to reuse.
          #
          # This step's only job is to match the already-installed
          # provisioning profile against ios/App/App.xcodeproj's build
          # settings and, as a result, write $HOME/export_options.plist
          # (i.e. /Users/builder/export_options.plist on Codemagic's Mac
          # build machines) -- the file "Build and archive the signed
          # .ipa" below passes via --export-options-plist. It must run
          # after Capacitor sync / CocoaPods install (so the Xcode project
          # it inspects is up to date) and before the archive step.
          xcode-project use-profiles

      - name: Verify export_options.plist was generated
        script: |
          set -euo pipefail
          # Explicit, readable check before archiving -- fails fast with a
          # clear, non-secret diagnostic instead of letting the archive step
          # fail later with a less actionable "path does not exist" error.
          export_options_plist="$HOME/export_options.plist"
          if [ ! -f "$export_options_plist" ]; then
            echo "export_options.plist was not found at $export_options_plist after 'xcode-project use-profiles' ran."
            echo "This means automatic signing could not resolve a certificate/provisioning profile for bundle ID $BUNDLE_ID. Common causes:"
            echo "  - the wakewise_distribution certificate or wakewise_app_store_profile provisioning profile is missing, expired, or no longer shows a valid certificate association in Codemagic's Code signing identities page"
            echo "  - the provisioning profile's bundle ID no longer matches $BUNDLE_ID"
            echo "  - the wakewise_app_store_connect integration isn't attached to this workflow, or its API key was revoked"
            echo "Contents of \$HOME (file/directory names only -- no file contents, no secret values):"
            ls -la "$HOME" || true
            exit 1
          fi
          echo "export_options.plist present at $export_options_plist"

      - name: Build and archive the signed .ipa
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      # Runs only if every script above exited 0 -- a failing build,
      # test, lint, sync, pod install, or archive step aborts the
      # workflow before this point is ever reached, so nothing is signed
      # or uploaded on a red build.
      app_store_connect:
        auth: integration
        # Uploads to TestFlight's processing area only. No beta_groups
        # entry is configured here on purpose, so the build is never
        # auto-distributed to any external or internal tester group --
        # adding yourself as the first internal tester is a deliberate,
        # manual App Store Connect step (see the setup guide).
        submit_to_testflight: true
        # App Store review submission stays explicitly disabled.
        submit_to_app_store: false

  # ==========================================================================
  # PHASE 2B READINESS — RevenueCat sandbox test workflow. PREPARED FOR
  # REVIEW, NOT YET RUNNABLE.
  #
  # Isolated from wakewise-ios-testflight above (not a single line of that
  # block is touched) — a completely separate workflow key, its own
  # environment variable group, its own (identical, reused) signing
  # integration. Exists only so the RevenueCat sandbox test surface
  # (SubscriptionSandboxTest.jsx, gated on VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST)
  # can reach a real device via TestFlight — Apple's own sandbox purchase
  # environment requires a properly signed, uploaded TestFlight build; a
  # local/simulator build cannot exercise real StoreKit purchases at all.
  #
  # BLOCKER, stated plainly: this workflow cannot actually run yet. Codemagic
  # builds from a git ref it can see remotely — every RevenueCat readiness-gap
  # change (revenueCatAdapter.js, revenueCatConfig.js, the new migration, this
  # very file) is still uncommitted, local-only, in the
  # phase2b-revenuecat-entitlements worktree. Starting this workflow today
  # would build whatever commit is actually pushed (1e62c4b or earlier),
  # NOT the reviewed, fixed code this task produced. Do not start it until
  # those changes are committed and pushed — a decision this task has not
  # been authorized to make.
  #
  # SETUP REQUIRED before this can run (none of this exists yet, none of it
  # was created by this task):
  #   1. A NEW Codemagic Application-level environment variable group,
  #      wakewise_revenuecat_sandbox, containing exactly:
  #        VITE_REVENUECAT_IOS_API_KEY       (marked Secret)
  #        VITE_REVENUECAT_ANDROID_API_KEY   (marked Secret — unused by this
  #                                            iOS workflow, but kept in one
  #                                            group with its Android
  #                                            counterpart rather than
  #                                            duplicating the group per
  #                                            platform)
  #        VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST=true (not secret — a plain
  #                                            build flag)
  #      Deliberately NOT added to wakewise_vite_public — that group's own
  #      header comment above restricts it to
  #      VITE_SUPABASE_URL/VITE_SUPABASE_PUBLISHABLE_KEY, and it feeds the
  #      production-bound workflow above; this workflow still references it
  #      (below) ONLY for those same two Supabase values, reused because
  #      both this repo's own docs and this task's own .env.local
  #      inspection agree they already point at the DEV Supabase project
  #      (kvdxuhyndevrfvsalgnx) — not independently re-verified against
  #      Codemagic's own dashboard by this task (no Codemagic dashboard
  #      access exists here); confirm this yourself in Codemagic's UI
  #      before trusting it blindly.
  #   2. This workflow reuses the SAME wakewise_app_store_connect
  #      integration and wakewise_distribution/wakewise_app_store_profile
  #      signing identities as the workflow above — a TestFlight sandbox
  #      purchase needs an ordinarily-signed, ordinarily-uploaded build;
  #      "sandbox" describes the StoreKit purchase environment, not a
  #      different code-signing path. No new Apple credential is needed.
  # ==========================================================================
  wakewise-ios-sandbox-test:
    name: WakeWise iOS Sandbox (RevenueCat Test)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      cocoapods: default
      node: 22.23.3
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: *bundle_id
      groups:
        - wakewise_vite_public
        - wakewise_revenuecat_sandbox
      ios_signing:
        distribution_type: app_store
        bundle_identifier: *bundle_id
    integrations:
      app_store_connect: wakewise_app_store_connect
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Verify this build targets DEV and the sandbox flag is enabled (values never printed, fails BEFORE any build step)
        script: |
          set -uo pipefail
          # This is the actual enforcement -- not a comment asking whoever
          # configured the Codemagic variable group to have gotten it
          # right. Every check below inspects the REAL resolved
          # environment variable value (never printed) and aborts before
          # `npm ci`/`vite build` ever runs if anything is wrong.
          missing=0
          for var_name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_REVENUECAT_IOS_API_KEY VITE_REVENUECAT_ANDROID_API_KEY VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required environment variable: $var_name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required environment variables are unset. Confirm wakewise_vite_public and wakewise_revenuecat_sandbox are both attached to THIS workflow (environment.groups, above) and re-run."
            exit 1
          fi

          # DEV-only enforcement: this workflow must never build against
          # any project other than kvdxuhyndevrfvsalgnx -- checked against
          # the actual VITE_SUPABASE_URL value, not inferred from which
          # variable group's name sounds right. The URL itself is not a
          # secret (it is the public Supabase endpoint), so it is safe to
          # print for a clear failure message.
          case "$VITE_SUPABASE_URL" in
            *kvdxuhyndevrfvsalgnx*) ;;
            *)
              echo "VITE_SUPABASE_URL ('$VITE_SUPABASE_URL') does not target the DEV Supabase project (kvdxuhyndevrfvsalgnx). This sandbox workflow must never build against any other project. Aborting."
              exit 1
              ;;
          esac
          echo "Confirmed: VITE_SUPABASE_URL targets DEV (kvdxuhyndevrfvsalgnx)."

          if [ "$VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST" != "true" ]; then
            echo "VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST must be the literal string 'true' for the sandbox test route to compile in -- got a different value. Aborting."
            exit 1
          fi
          echo "Confirmed: VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST=true."

      - name: Install npm dependencies (npm ci)
        script: |
          set -euo pipefail
          npm ci

      - name: Build the web app (vite build)
        script: |
          set -euo pipefail
          npm run build

      - name: Run the automated test suite
        script: |
          set -euo pipefail
          npm test

      - name: Lint
        script: |
          set -euo pipefail
          npm run lint

      - name: Confirm the sandbox test route actually compiled in (not the inert stub)
        script: |
          set -euo pipefail
          # Same check this task ran locally after its own web build --
          # fails the build loudly if the flag above didn't actually reach
          # Vite, rather than silently shipping an inert sandbox route.
          if ! grep -rq "RevenueCat sandbox test surface" dist/assets/*.js; then
            echo "The sandbox test panel's own marker string was not found in the built output -- VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST did not compile to true. Aborting."
            exit 1
          fi
          echo "Confirmed: the sandbox test panel is present in this build's output."

      - name: Capacitor sync (copy web build + native deps into ios/)
        script: |
          set -euo pipefail
          npx cap sync ios

      - name: Verify WebView debugging is disabled in the generated native config
        script: |
          set -euo pipefail
          generated_config="ios/App/App/capacitor.config.json"
          if [ ! -f "$generated_config" ]; then
            echo "$generated_config was not generated by 'Capacitor sync' -- cannot verify WebView debugging is disabled. Aborting."
            exit 1
          fi
          if grep -q '"webContentsDebuggingEnabled"[[:space:]]*:[[:space:]]*true' "$generated_config"; then
            echo "webContentsDebuggingEnabled is true in $generated_config -- this must never ship, even to internal sandbox testers. Aborting."
            exit 1
          fi
          echo "Confirmed: webContentsDebuggingEnabled is not true in the generated native config."

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd ios/App
          pod install

      - name: Determine and set the next available sandbox build number
        script: |
          set -euo pipefail
          # Build 24 (the previous hardcoded pin here) now exists in App
          # Store Connect. Rather than re-pin a second literal (25) that
          # would just go stale the same way the moment another build
          # lands, this always queries App Store Connect for the real
          # current highest build number and uses highest+1 - correct on
          # every run, not just this one. Same no-guessing discipline as
          # before: if the query fails, this aborts rather than falling
          # back to a counter or timestamp.
          #
          # `app-store-connect get-latest-build-number` takes the app's
          # numeric Apple ID (APPLICATION_ID_RESOURCE_ID per the CLI's own
          # docs), not the bundle identifier -- passing $BUNDLE_ID directly
          # (as this step previously did) made the CLI request
          # /v1/apps/com.zavaraai.wakewise/appStoreVersions, which App
          # Store Connect 404s because no app resource is ever addressed
          # by its bundle ID in that API. Resolve the numeric app ID first,
          # via the same authenticated wakewise_app_store_connect
          # integration, instead of hardcoding it.
          APP_LOOKUP_JSON="$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json)"
          APP_ID="$(echo "$APP_LOOKUP_JSON" | jq -r 'if type == "array" then . else .data end | map(.id) | if length == 1 then .[0] else "" end')"
          if [ -z "$APP_ID" ] || ! [[ "$APP_ID" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve exactly one numeric App Store Connect app ID for bundle ID $BUNDLE_ID (lookup returned: $APP_LOOKUP_JSON). Refusing to guess -- aborting rather than hardcoding or falling back to a cached value."
            exit 1
          fi
          echo "Resolved App Store Connect app ID $APP_ID for bundle ID $BUNDLE_ID."

          QUERIED_BUILD_NUMBER="$(app-store-connect get-latest-build-number --platform IOS "$APP_ID")"
          if ! [[ "$QUERIED_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Could not obtain a valid highest-build-number response from App Store Connect for app ID $APP_ID / bundle ID $BUNDLE_ID (got: '$QUERIED_BUILD_NUMBER'). Refusing to guess -- aborting rather than falling back to a counter or timestamp."
            exit 1
          fi

          BUILD_NUMBER=$((QUERIED_BUILD_NUMBER + 1))
          echo "Highest existing build in App Store Connect for $BUNDLE_ID: $QUERIED_BUILD_NUMBER. Using next available: $BUILD_NUMBER."
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Apply the stored signing certificate and profile to the Xcode project
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Verify export_options.plist was generated
        script: |
          set -euo pipefail
          export_options_plist="$HOME/export_options.plist"
          if [ ! -f "$export_options_plist" ]; then
            echo "export_options.plist was not found at $export_options_plist after 'xcode-project use-profiles' ran."
            exit 1
          fi
          echo "export_options.plist present at $export_options_plist"

      - name: Build and archive the signed .ipa
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # No `beta_groups` entry -- Codemagic itself never auto-distributes
        # to a named group without one (confirmed from Codemagic's own
        # publishing docs: beta_groups is explicitly what "specifies the
        # names of beta tester groups that will get access to the build";
        # omitting it means Codemagic issues no distribution instruction at
        # all). What Codemagic's docs do NOT resolve, and this task could
        # not verify (no App Store Connect dashboard access): whether the
        # existing "WakeWise Internal Testers" GROUP ITSELF has its own
        # "automatically distribute new builds" toggle enabled in App
        # Store Connect -- a setting that lives entirely on Apple's side,
        # independent of this file, and would apply to ANY new build
        # landing for this app (production or sandbox) if it's on.
        #
        # Because that can't be verified from here, do NOT assume reusing
        # "WakeWise Internal Testers" is safe. Before ever running this
        # workflow: either (a) create a SEPARATE App Store Connect internal
        # group (e.g. "WakeWise Sandbox Testers") with nobody auto-added,
        # so only people deliberately opted into sandbox testing ever see
        # this build, or (b) if reusing the existing group is truly
        # intended, first confirm in App Store Connect that its
        # auto-distribute setting is off and adding a tester stays a manual
        # step -- exactly like the production workflow's own stated
        # discipline above.
        submit_to_testflight: true
        submit_to_app_store: false

  # ==========================================================================
  # DISCLOSURE-TEST — iOS workflow for verifying the real (non-sandbox-
  # substituted) trial/renewal/cancellation disclosure text with real
  # RevenueCat product data. PREPARED FOR REVIEW, NOT YET RUNNABLE.
  #
  # WHY THIS EXISTS: wakewise-ios-sandbox-test (above) is the only existing
  # workflow with a real RevenueCat key, but its own wakewise_revenuecat_sandbox
  # group ALSO bundles VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST=true (confirmed —
  # see that workflow's own setup-instructions comment above, and the
  # PRODUCTION workflow's own header below, which independently documents
  # the exact same fact for the exact same reason). That flag makes
  # Subscription.jsx substitute SANDBOX_RENEWAL_TEXT ("this sandbox test
  # build never charges real money...") for the real renewal/cancellation
  # disclosure sentence — so that workflow's own builds can never be used to
  # verify PRC-02/ST-38's actual required wording. wakewise-ios-testflight
  # (above) has the opposite problem: no RevenueCat key at all, so
  # Purchases.configure() fails, nativeProductsState never reaches 'ready',
  # and NEITHER the price nor the disclosure paragraph renders — confirmed
  # by tracing revenueCatAdapter.js's own `configured` guard, not assumed.
  # Neither existing workflow can answer this question. This one is built
  # specifically to combine real RevenueCat sandbox DATA with the real
  # disclosure TEXT, on the DEV backend (no production dependency at all).
  #
  # DELIBERATELY NOT solved by reusing wakewise_revenuecat_sandbox with an
  # overriding workflow-level var: Codemagic's own documented precedence
  # rule only confirms "when multiple GROUPS of the same precedence define
  # the same variable, the last-imported group wins" — it does not document
  # workflow-level vars vs. group vars, so relying on that would be an
  # unverified assumption. Solved instead the SAME way the PRODUCTION
  # workflow below already solves the identical problem: a dedicated group
  # that simply never contains the flag at all, so there is nothing to
  # override — no precedence question to get wrong either way. Belt-and-
  # braces: the verification step below also checks the EFFECTIVE resolved
  # value at build time and aborts if it is ever "true", regardless of
  # source, exactly mirroring the PRODUCTION workflow's own guard.
  #
  # Isolated from all three workflows above — a completely separate workflow
  # key. Nothing above is touched by this block.
  #
  # BLOCKER, stated plainly: this workflow cannot actually run yet. Before it
  # can, the owner must create, in Codemagic's own UI:
  #   1. A NEW Application-level environment variable group,
  #      wakewise_revenuecat_disclosure_test, containing exactly:
  #        VITE_REVENUECAT_IOS_API_KEY (marked Secret) — the SAME value
  #                                    already set (or to be set) in
  #                                    wakewise_revenuecat_sandbox's own
  #                                    VITE_REVENUECAT_IOS_API_KEY — copy it,
  #                                    never a different/new key (same
  #                                    reasoning the PRODUCTION workflow's
  #                                    own header already gives for its own
  #                                    wakewise_revenuecat_production
  #                                    group). Do NOT add
  #                                    VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST
  #                                    to this group, at all, in any value —
  #                                    its absence is exactly what this
  #                                    workflow depends on.
  #   2. Reuses wakewise_vite_public (same DEV Supabase values already used
  #      by wakewise-ios-testflight and wakewise-ios-sandbox-test above) —
  #      no new Supabase credential needed.
  #   3. Reuses the SAME wakewise_app_store_connect integration and signing
  #      identities as every workflow above — no new Apple credential
  #      needed.
  #   4. Before ever running this workflow: either create a SEPARATE App
  #      Store Connect internal tester group with nobody auto-added, or
  #      confirm in App Store Connect that reusing an existing group's
  #      auto-distribute setting is off — same discipline the sandbox
  #      workflow's own publishing comment above already states, for the
  #      same reason.
  # ==========================================================================
  wakewise-ios-disclosure-test:
    name: WakeWise iOS Disclosure Test
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      cocoapods: default
      node: 22.23.3
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: *bundle_id
      groups:
        - wakewise_vite_public
        - wakewise_revenuecat_disclosure_test
      ios_signing:
        distribution_type: app_store
        bundle_identifier: *bundle_id
    integrations:
      app_store_connect: wakewise_app_store_connect
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Verify DEV backend, RevenueCat key, and the sandbox-display flag's EFFECTIVE value (values never printed, fails BEFORE any build step)
        script: |
          set -uo pipefail
          # Inspects the REAL resolved environment variable values (never
          # printed) and aborts before npm ci/vite build ever runs — same
          # discipline as every workflow above.
          missing=0
          for var_name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_REVENUECAT_IOS_API_KEY; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required environment variable: $var_name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required environment variables are unset. Confirm wakewise_vite_public and wakewise_revenuecat_disclosure_test are both attached to THIS workflow (environment.groups, above) and re-run."
            exit 1
          fi

          # DEV-only enforcement — identical check to wakewise-ios-sandbox-test's
          # own guard above: this workflow must never build against any
          # project other than kvdxuhyndevrfvsalgnx. The URL itself is not a
          # secret, so it is safe to print for a clear failure message.
          case "$VITE_SUPABASE_URL" in
            *kvdxuhyndevrfvsalgnx*) ;;
            *)
              echo "VITE_SUPABASE_URL ('$VITE_SUPABASE_URL') does not target the DEV Supabase project (kvdxuhyndevrfvsalgnx). This workflow must never build against any other project. Aborting."
              exit 1
              ;;
          esac
          echo "Confirmed: VITE_SUPABASE_URL targets DEV (kvdxuhyndevrfvsalgnx)."

          # THE ACTUAL POINT OF THIS WORKFLOW — checked by EFFECTIVE value,
          # not by which group it is assumed to come from: if this is ever
          # "true" for any reason (a future edit reintroducing the bundled
          # sandbox group, a Codemagic-side default, anything), abort rather
          # than silently building the sandbox-substituted disclosure text
          # again.
          if [ "${VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST:-}" = "true" ]; then
            echo "VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST is 'true' for this workflow - this workflow exists specifically to show the REAL disclosure text, which this flag would suppress. Aborting."
            exit 1
          fi
          echo "Confirmed: VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST is not 'true' (real disclosure text will compile in)."

      - name: Install npm dependencies (npm ci)
        script: |
          set -euo pipefail
          npm ci

      - name: Build the web app (vite build)
        script: |
          set -euo pipefail
          npm run build

      - name: Run the automated test suite
        script: |
          set -euo pipefail
          npm test

      - name: Lint
        script: |
          set -euo pipefail
          npm run lint

      - name: Confirm the sandbox test panel did NOT compile into this build's output
        script: |
          set -euo pipefail
          # Mirrors the PRODUCTION workflow's own equivalent check below —
          # post-build confirmation, not just a pre-build env-var check,
          # that the real disclosure text actually compiled in rather than
          # the sandbox substitute.
          if grep -rq "RevenueCat sandbox test surface" dist/assets/*.js; then
            echo "The sandbox test panel's own marker string WAS found in this build's output - VITE_ENABLE_SUBSCRIPTION_SANDBOX_TEST compiled to true somewhere. Aborting."
            exit 1
          fi
          echo "Confirmed: the sandbox test panel is absent from this build's output."

      - name: Capacitor sync (copy web build + native deps into ios/)
        script: |
          set -euo pipefail
          npx cap sync ios

      - name: Verify WebView debugging is disabled in the generated native config
        script: |
          set -euo pipefail
          generated_config="ios/App/App/capacitor.config.json"
          if [ ! -f "$generated_config" ]; then
            echo "$generated_config was not generated by 'Capacitor sync' -- cannot verify WebView debugging is disabled. Aborting."
            exit 1
          fi
          if grep -q '"webContentsDebuggingEnabled"[[:space:]]*:[[:space:]]*true' "$generated_config"; then
            echo "webContentsDebuggingEnabled is true in $generated_config -- this must never ship, even to internal testers. Aborting."
            exit 1
          fi
          echo "Confirmed: webContentsDebuggingEnabled is not true in the generated native config."

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd ios/App
          pod install

      - name: Determine and set the next available build number
        script: |
          set -euo pipefail
          APP_LOOKUP_JSON="$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json)"
          APP_ID="$(echo "$APP_LOOKUP_JSON" | jq -r 'if type == "array" then . else .data end | map(.id) | if length == 1 then .[0] else "" end')"
          if [ -z "$APP_ID" ] || ! [[ "$APP_ID" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve exactly one numeric App Store Connect app ID for bundle ID $BUNDLE_ID (lookup returned: $APP_LOOKUP_JSON). Refusing to guess -- aborting rather than hardcoding or falling back to a cached value."
            exit 1
          fi
          echo "Resolved App Store Connect app ID $APP_ID for bundle ID $BUNDLE_ID."

          QUERIED_BUILD_NUMBER="$(app-store-connect get-latest-build-number --platform IOS "$APP_ID")"
          if ! [[ "$QUERIED_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Could not obtain a valid highest-build-number response from App Store Connect for app ID $APP_ID / bundle ID $BUNDLE_ID (got: '$QUERIED_BUILD_NUMBER'). Refusing to guess -- aborting rather than falling back to a counter or timestamp."
            exit 1
          fi

          BUILD_NUMBER=$((QUERIED_BUILD_NUMBER + 1))
          echo "Highest existing build in App Store Connect for $BUNDLE_ID: $QUERIED_BUILD_NUMBER. Using next available: $BUILD_NUMBER."
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Apply the stored signing certificate and profile to the Xcode project
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Verify export_options.plist was generated
        script: |
          set -euo pipefail
          export_options_plist="$HOME/export_options.plist"
          if [ ! -f "$export_options_plist" ]; then
            echo "export_options.plist was not found at $export_options_plist after 'xcode-project use-profiles' ran."
            exit 1
          fi
          echo "export_options.plist present at $export_options_plist"

      - name: Build and archive the signed .ipa
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Same undistributed-by-default reasoning as the sandbox workflow's
        # own publishing comment above — confirm tester-group auto-distribute
        # is off, or use a dedicated group, before ever running this.
        submit_to_testflight: true
        submit_to_app_store: false

  # ==========================================================================
  # PRODUCTION — iOS release workflow. PREPARED FOR REVIEW, NOT YET RUNNABLE.
  #
  # Isolated from both workflows above — a completely separate workflow key,
  # its own environment variable groups. Neither wakewise-ios-testflight nor
  # wakewise-ios-sandbox-test is touched by this block.
  #
  # BLOCKER, stated plainly: this workflow cannot actually run yet. Nothing
  # below invents or guesses a secret value — every credential is a *name*
  # of a Codemagic group/integration that does not exist yet. Before this
  # can run, the owner must create, in Codemagic's own UI:
  #   1. A NEW Application-level environment variable group,
  #      wakewise_vite_production, containing exactly:
  #        VITE_SUPABASE_URL          (marked Secret) — expected value
  #                                    https://wqpszprbuqdjcfmdqdlv.supabase.co
  #                                    (the production Supabase project ref,
  #                                    confirmed via `supabase projects list`
  #                                    as "WakeWise Prod" — not a guess. The
  #                                    exact URL string is still the owner's
