  #                                    distinguished per-event by
  #                                    RevenueCat's own event.environment
  #                                    field ('SANDBOX'|'PRODUCTION', see
  #                                    _shared/revenueCatEventMapping.js's
  #                                    own header), never by which key was
  #                                    used to initialise the SDK. The
  #                                    owner should copy the EXACT SAME
  #                                    value already set (or to be set) as
  #                                    wakewise_revenuecat_sandbox's
  #                                    VITE_REVENUECAT_IOS_API_KEY into this
  #                                    group too - not obtain or request a
  #                                    second, different key. (Same for
  #                                    VITE_REVENUECAT_ANDROID_API_KEY if
