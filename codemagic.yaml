  #                                    access to create the group itself.)
  #        VITE_SUPABASE_PUBLISHABLE_KEY (marked Secret) — the production
  #                                    project's own publishable key (replaces
  #                                    the legacy anon key — DEV service-role
  #                                    credential exposure remediation, see
  #                                    tracker SEC-07/E-37). UNKNOWN to this
  #                                    task: fetching it would mean reading
  #                                    from the production project, which
  #                                    this task was explicitly told never to
  #                                    touch. The owner must supply it from
  #                                    the production Supabase dashboard
  #                                    (Project Settings -> API Keys).
  #   2. A SECOND new group, wakewise_revenuecat_production, containing
  #      exactly:
  #        VITE_REVENUECAT_IOS_API_KEY (marked Secret) — CORRECTED: this is
  #                                    NOT a different "production" key.
  #                                    RevenueCat's own convention, already
  #                                    documented in this repo
  #                                    (src/lib/revenueCatConfig.js: "one
  #                                    per platform... unlike Stripe/Apple,
  #                                    a single cross-platform key is never
  #                                    correct here") is one public SDK key
  #                                    PER PLATFORM, not per environment -
  #                                    sandbox and production purchases
