<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WakeWise</title>
    <!-- Capacitor iOS Foundation: the index.html served by Vercel already
         gets this same policy via an HTTP response header (vercel.json) —
         that header does not apply inside the native app, where this same
         index.html is loaded locally from the bundle over `capacitor://`
         with no HTTP layer at all. This <meta> tag is the only way to get
         a CSP applied natively, so it mirrors the vercel.json policy
         exactly (same directives, same allowances) to avoid changing web
         behaviour. Per the CSP spec, `frame-ancestors` and any report-uri
         are ignored when delivered via <meta> (clickjacking protection on
         web still comes from the X-Frame-Options header; there is no
         framing risk natively). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://vercel.live; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://vercel.live; media-src 'self' blob: https://kvdxuhyndevrfvsalgnx.supabase.co; connect-src 'self' https://kvdxuhyndevrfvsalgnx.supabase.co wss://kvdxuhyndevrfvsalgnx.supabase.co https://vercel.live wss://ws-us3.pusher.com; frame-src https://vercel.live; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Stage 3 "felt" typography voice (design proposal §11) — additive -->
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <!-- Morning Visual Uplift — Playfair Display, deliberately Morning's own
         display serif, distinct from Newsreader (which stays Evening's/the
         app's general-purpose serif, completely unchanged). Loaded via this
         same established <link> pattern, never a runtime/CDN <script>
         request - see tailwind.config.js's `font-morning-display` comment
         for the fallback stack and full rationale. SIL Open Font License,
         same license family already relied on for Newsreader/Plus Jakarta
         Sans - free for this app's commercial use. -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  </head>
  <!-- Nested-scroll-container repair: `overflow-x-hidden` alone (no
       overflow-y) used to leave body's used overflow-y as `visible`,
       which the CSS Overflow spec then converts to `auto` per the
       "one axis restricted, the other still visible" propagation rule
       (confirmed live: getComputedStyle(body).overflow reported
       "hidden auto", not "hidden hidden") - silently turning <body> into
       a second, independent scrollable element competing with Layout.jsx's
       own single intended scroll container (the `overflow-y-auto` div
       inside it). Body/html have no content of their own that should ever
       need to scroll - Layout's root is `h-dvh` (exactly one viewport
       tall) with all vertical overflow handled by its own inner div -
       so both axes are explicitly hidden here now, removing the ambiguity
       entirely rather than leaving y to fall back to a spec default. -->
  <body class="m-0 p-0 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
